name: Playwright Table Scraper Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scrape-tables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Script for 22f3001561@ds.study.iitm.ac.in
        run: node scrape.js
